<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1, user-scalable=no: without these, a two-finger pinch
         on the cube zooms the whole PAGE (mobile Safari/Chrome's native
         behavior) instead of the 3D camera zoom OrbitControls already
         provides. This trades away page pinch-zoom entirely, which is the
         right tradeoff for an app whose zoom happens via the 3D camera. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>test-app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
